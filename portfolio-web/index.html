<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amruta Bendale | Full Stack AI Engineer</title>
    <meta name="description" content="Full Stack AI Engineer with 4 years of experience building financial systems, distributed services, and agentic AI." />
    <link rel="canonical" href="https://amruuta.github.io/" />
    <meta name="theme-color" content="#2563EB" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Link previews (Slack, LinkedIn, WhatsApp, X). Without these the URL
         shares as a blank card. og:image is absolute because crawlers don't
         resolve relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amruta Bendale" />
    <meta property="og:url" content="https://amruuta.github.io/" />
    <meta property="og:title" content="Amruta Bendale | Full Stack AI Engineer" />
    <meta property="og:description" content="Full Stack AI Engineer with 4 years of experience building financial systems, distributed services, and agentic AI." />
    <meta property="og:image" content="https://amruuta.github.io/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Amruta Bendale — Full Stack AI Engineer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amruta Bendale | Full Stack AI Engineer" />
    <meta name="twitter:description" content="Full Stack AI Engineer with 4 years of experience building financial systems, distributed services, and agentic AI." />
    <meta name="twitter:image" content="https://amruuta.github.io/og-card.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Applies the theme before first paint. React sets the same class, but
         only in an effect that runs after paint — so without this a dark-mode
         visitor gets a flash of the full-brightness page on every load. Kept
         in sync with getInitialTheme() in src/lib/ThemeContext.tsx. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var dark = saved === 'dark' ||
            (!saved && window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
